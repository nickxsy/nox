# Хуки выполняются до коммита
pre-commit:
  # Запускать команды параллельно для ускорения
  parallel: true
  commands:
    # Проверка форматирования файлов
    formatting:
      glob: '*.{js,ts,jsx,tsx,md,mdx,json,yml}'
      run: pnpm fmt:check
    # Лinting JavaScript/TypeScript файлов
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: pnpm lint

# Хуки выполняются перед пушем
pre-push:
  commands:
    # Запуск тестов перед пушем
    test:
      run: pnpm test